<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pipe Catalog App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- App Header -->
  <header class="app-header">
    <h1>Pipe Catalog Dashboard</h1>
  </header>

  <!-- Dashboard Modules -->
  <main class="dashboard">
    <div class="module-card" onclick="openView('products')">
      <h2>Products</h2>
      <p>Add, edit, update stock, view details</p>
    </div>

    <div class="module-card" onclick="openView('customers')">
      <h2>Customers</h2>
      <p>Add, edit, update info, view details</p>
    </div>

    <div class="module-card" onclick="openView('quotations')">
      <h2>Quotations</h2>
      <p>Saved quotations list, new quotation, edit, PDF, duplicate</p>
    </div>

    <div class="module-card" onclick="openView('gallery')">
      <h2>Gallery</h2>
      <p>Browse product images from Drive</p>
    </div>

    <div class="module-card" onclick="openView('downloads')">
      <h2>Downloads</h2>
      <p>View catalogues, price lists, documents</p>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
