<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2196F3">
    <meta name="description" content="KHYATI POLYMERS Inventory Management">
    <title>KHYATI POLYMERS - Inventory</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="apple-touch-icon" href="images/icon-192.png">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <h1>📦 KHYATI POLYMERS</h1>
            <p>Inventory Management</p>
        </header>

        <div class="tabs">
            <button class="tab-btn active" onclick="showTab('add')">Add Product</button>
            <button class="tab-btn" onclick="showTab('view')">View Inventory</button>
            <button class="tab-btn" onclick="showTab('update')">Update Stock</button>
        </div>

        <div id="add-tab" class="tab-content active">
            <h2>Add New Product</h2>
            <form id="add-form">
                <div class="form-group">
                    <label>Product Name</label>
                    <input type="text" id="product-name" required>
                </div>
                <div class="form-group">
                    <label>Product Code/SKU</label>
                    <input type="text" id="product-code" required>
                </div>
                <div class="form-group">
                    <label>Category</label>
                    <input type="text" id="category" placeholder="e.g., Raw Material, Finished Goods">
                </div>
                <div class="form-group">
                    <label>Quantity</label>
                    <input type="number" id="quantity" required min="0">
                </div>
                <div class="form-group">
                    <label>Unit</label>
                    <input type="text" id="unit" placeholder="e.g., kg, pcs, liters">
                </div>
                <div class="form-group">
                    <label>Price per Unit (₹)</label>
                    <input type="number" id="price" step="0.01" min="0">
                </div>
                <div class="form-group">
                    <label>Supplier</label>
                    <input type="text" id="supplier">
                </div>
                <button type="submit" class="btn btn-primary">Add Product</button>
            </form>
        </div>

        <div id="view-tab" class="tab-content">
            <h2>Current Inventory</h2>
            <div class="search-box">
                <input type="text" id="search" placeholder="Search products..." oninput="filterInventory()">
            </div>
            <button onclick="loadInventory()" class="btn btn-secondary">Refresh Data</button>
            <div id="inventory-list" class="inventory-grid">
                <p class="loading">Click "Refresh Data" to load inventory...</p>
            </div>
        </div>

        <div id="update-tab" class="tab-content">
            <h2>Update Stock</h2>
            <form id="update-form">
                <div class="form-group">
                    <label>Product Code/SKU</label>
                    <input type="text" id="update-code" required>
                </div>
                <div class="form-group">
                    <label>Action</label>
                    <select id="action" required>
                        <option value="add">Add Stock</option>
                        <option value="remove">Remove Stock</option>
                        <option value="set">Set Stock</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Quantity</label>
                    <input type="number" id="update-quantity" required min="0">
                </div>
                <div class="form-group">
                    <label>Notes</label>
                    <input type="text" id="notes" placeholder="Reason for update">
                </div>
                <button type="submit" class="btn btn-primary">Update Stock</button>
            </form>
        </div>

        <div id="status-message" class="status-message"></div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
